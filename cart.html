<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — UniStyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">UNI<span>STYLE</span></a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="shop.html" data-page="shop.html">Shop</a>
      <a href="about.html" data-page="about.html">About</a>
      <a href="contact.html" data-page="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="icon-btn" aria-label="Cart">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16151c" stroke-width="1.8"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </a>
      <button class="menu-toggle" aria-label="Menu" aria-expanded="false" onclick="document.getElementById('navLinks').classList.toggle('open')">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div class="page-head">
  <div class="wrap">
    <p class="breadcrumb"><a href="index.html">Home</a> / Cart</p>
    <h1>Your cart</h1>
  </div>
</div>

<section>
  <div class="wrap" id="cartWrap"></div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="stitch"></div>
    <div class="footer-bottom">
      <span>© <span data-year></span> UniStyle. All rights reserved.</span>
      <span>Pay on delivery — no card required to order.</span>
    </div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  function render(){
    const lines = getCartLines();
    const wrap = document.getElementById("cartWrap");

    if(!lines.length){
      wrap.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M20 30h60l-6 55H26L20 30Z" fill="none" stroke="#16151c" stroke-width="3"/><path d="M35 30v-6a15 15 0 0 1 30 0v6" fill="none" stroke="#16151c" stroke-width="3"/></svg>
          <h2>Your cart is empty</h2>
          <p class="muted">Nothing stitched in yet — go find something you'll wear on repeat.</p>
          <a href="shop.html" class="btn">Browse the shop</a>
        </div>`;
      return;
    }

    const totals = getCartTotals();

    wrap.innerHTML = `
      <div class="cart-layout">
        <div>
          <div id="cartItems"></div>
          <a href="shop.html" class="btn btn--ghost" style="margin-top:24px;">← Continue shopping</a>
        </div>
        <div class="summary-box">
          <h3 style="font-size:1.4rem;">Order summary</h3>
          <div class="summary-row"><span>Subtotal</span><span>${formatPrice(totals.subtotal)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>${formatPrice(totals.shipping)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatPrice(totals.total)}</span></div>
          <a href="checkout.html" class="btn btn--block" style="margin-top:18px;">Checkout</a>
          <p class="muted" style="font-size:.8rem;margin-top:14px;">Pay on delivery — no payment details needed to place your order.</p>
        </div>
      </div>`;

    document.getElementById("cartItems").innerHTML = lines.map(line => `
      <div class="cart-item">
        <div class="cart-item-media" style="background:${line.product.swatch}22;">${getGarmentSVG(line.product.icon, line.product.swatch)}</div>
        <div>
          <a href="product.html?id=${line.product.id}" class="cart-item-name">${line.product.name}</a>
          <div class="cart-item-meta">Size ${line.size} · ${formatPrice(line.product.price)} each</div>
          <button class="remove-link" data-remove="${line.index}">Remove</button>
        </div>
        <div class="qty-row">
          <button type="button" data-qty-minus="${line.index}" aria-label="Decrease quantity">−</button>
          <input type="text" value="${line.qty}" readonly aria-label="Quantity">
          <button type="button" data-qty-plus="${line.index}" aria-label="Increase quantity">+</button>
        </div>
        <div class="cart-item-price">${formatPrice(line.product.price * line.qty)}</div>
      </div>`).join("");

    document.querySelectorAll("[data-remove]").forEach(btn => {
      btn.addEventListener("click", () => { removeFromCart(Number(btn.dataset.remove)); render(); });
    });
    document.querySelectorAll("[data-qty-minus]").forEach(btn => {
      btn.addEventListener("click", () => {
        const i = Number(btn.dataset.qtyMinus);
        const cart = getCart();
        if(cart[i].qty <= 1){ removeFromCart(i); } else { updateCartQty(i, cart[i].qty - 1); }
        render();
      });
    });
    document.querySelectorAll("[data-qty-plus]").forEach(btn => {
      btn.addEventListener("click", () => {
        const i = Number(btn.dataset.qtyPlus);
        const cart = getCart();
        updateCartQty(i, cart[i].qty + 1);
        render();
      });
    });
  }

  render();
</script>
</body>
</html>
